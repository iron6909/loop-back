name: Release

# Tag 触发自动发布：构建 Android 签名 APK 并直接发布 GitHub Release。
#
# 本分支不上架应用商店，GitHub Releases 是唯一分发渠道。
#
# 触发：
#   - push tag 形如 v1.0.45（推荐，新格式）或 v1.0.45+N（兼容旧格式）
#   - 或在 Actions 页面手动 dispatch 选 tag
#
# 版本号约定：
#   - tag 用纯 SemVer（v1.0.45），不带 +N
#   - versionCode 由 CI 自动用 git rev-list --count <tag> 生成，全局单调递增
#   - 签名使用仓库 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#     ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS（与本地 android/key.properties 同一把密钥）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.45)'
        required: true

env:
  FLUTTER_VERSION: '3.41.5'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Parse version from tag
        id: ver
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # 兼容新格式 vX.Y.Z 和旧格式 vX.Y.Z+N
          if [[ "$TAG_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            NAME="${BASH_REMATCH[1]}"
            # versionCode = 该 tag 指向 commit 的 git rev-list count
            NUMBER="$(git rev-list --count "$TAG_REF")"
          elif [[ "$TAG_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            NAME="${BASH_REMATCH[1]}"
            NUMBER="${BASH_REMATCH[2]}"
          else
            echo "ERROR: tag '$TAG_REF' is not in vX.Y.Z or vX.Y.Z+N format" >&2
            exit 1
          fi
          if [[ -z "$NUMBER" || "$NUMBER" -le 0 ]]; then
            echo "ERROR: invalid build number ($NUMBER) for tag $TAG_REF" >&2
            exit 1
          fi

          # 校验 versionCode 严格大于所有历史 tag 的 versionCode
          # 防止人为意外打了倒退的 +N 旧格式 tag
          git fetch --tags --force
          MAX_CODE=0
          for t in $(git tag -l 'v*'); do
            if [[ "$t" == "$TAG_REF" ]]; then continue; fi
            if [[ "$t" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
              CODE="${BASH_REMATCH[2]}"
            elif [[ "$t" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              CODE="$(git rev-list --count "$t" 2>/dev/null || echo 0)"
            else
              continue
            fi
            if [[ "$CODE" -gt "$MAX_CODE" ]]; then MAX_CODE="$CODE"; fi
          done
          if [[ "$NUMBER" -le "$MAX_CODE" ]]; then
            printf "ERROR: versionCode %s must exceed max existing %s\n" \
              "$NUMBER" "$MAX_CODE" >&2
            echo "如需重新构建已发布的 tag，请在最新 commit 上加空 commit 后再打新 tag" >&2
            exit 1
          fi

          # 校验 pubspec.yaml 版本号一致
          PUBSPEC_VERSION="$(
            grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1
          )"
          if [[ "$NAME" != "$PUBSPEC_VERSION" ]]; then
            printf "ERROR: tag (%s) does not match pubspec.yaml (%s)\n" \
              "$NAME" "$PUBSPEC_VERSION" >&2
            echo "请先升级 pubspec.yaml 的 version 字段，再打 tag。" >&2
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "version=${NAME}+${NUMBER}" >> "$GITHUB_OUTPUT"
          printf "Parsed: name=%s number=%s (pubspec OK, max code=%s)\n" \
            "$NAME" "$NUMBER" "$MAX_CODE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../app/upload-keystore.jks
          EOF

      - name: Build Android APK
        env:
          BUILD_NAME: ${{ steps.ver.outputs.name }}
          BUILD_NUMBER: ${{ steps.ver.outputs.number }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
        run: |
          flutter clean
          DART_DEFINES=(
            "--dart-define=POSTHOG_HOST=${POSTHOG_HOST}"
          )
          if [[ -n "$POSTHOG_API_KEY" ]]; then
            DART_DEFINES+=("--dart-define=POSTHOG_API_KEY=${POSTHOG_API_KEY}")
          fi
          # 侧载包声明 direct 渠道，供设备诊断使用。
          DART_DEFINES+=("--dart-define=DISTRIBUTION_CHANNEL=direct")
          flutter build apk --release --flavor=prod \
            --target-platform android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            "${DART_DEFINES[@]}"
          mkdir -p build/release
          # 文件名只用 versionName。versionCode 已经隐藏在 APK 元数据里，
          # 对外分发不需要暴露。同 versionName 重发会覆盖。
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
             "build/release/LoopBack-${BUILD_NAME}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/release/LoopBack-*-arm64.apk
          retention-days: 30

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ./artifacts/LoopBack-*-arm64.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
