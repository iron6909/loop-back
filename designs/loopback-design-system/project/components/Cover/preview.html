<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LoopBack</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--page); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:640px; height:288px; }
  .brand { fill:var(--brand); }
  .tint { fill:var(--brand-deep); }
  .deep { fill:var(--ink); }
  .ok { fill:var(--success); }
  .mark { fill:var(--bookmark); }
  .cut { stroke:var(--card); fill:none; }
  .echo { stroke:var(--brand-active); fill:none; }
  .blk { rx:var(--radius-md); }
  .mini { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-4); right:var(--space-4); bottom:var(--space-4); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.9; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:13px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 640 288" width="640" height="288">
<!--
  blocks      brand 168×288 full height (the identity slab) · brand-deep 160×208 (the deep-blue slab; in dark theme brand and brand-active collapse to #3aa0ff, so the second slab binds to brand-deep to stay visible) · ink 280×168 bleeding off the right edge · success 72×24 and bookmark 64×24 once each (state hues stay small) — ≈55% of 960×288
  arrangement one tall brand slab with satellites: the deep-blue slab stacked beside it, the ink slab bleeding right, two small state blocks on the ground line under the ink slab, space-2 gutters, bottoms space-2 above the edge
  pattern     the literal motif, the loop: the mark's arc + arrowhead + three sound bars cut in card-white on the brand slab, a half loop cut in card-white on the deep-blue slab, a quarter loop in brand-active on the ink slab
  scales      gutters space-2; small blocks 24 tall (pills, rx = half = radius-sm); slab corners radius-md; pitch inside the mark from the 512px master, halved
-->
<rect class="brand blk" x="0" y="0" width="168" height="288" rx="16"/>
<rect class="tint blk" x="184" y="0" width="160" height="208" rx="16"/>
<rect class="deep blk" x="360" y="0" width="280" height="168" rx="16"/>
<rect class="ok mini" x="360" y="256" width="72" height="24" rx="12"/>
<rect class="mark mini" x="448" y="256" width="64" height="24" rx="12"/>
<path class="cut" d="M 93 98.8 A 52 52 0 1 0 132.9 132.2" stroke-width="18" stroke-linecap="round"/>
<path class="brand" d="M 141.4 129.1 L 124.4 135.3 L 122.6 104 Z" fill="var(--card)"/>
<rect class="brand" x="62" y="186" width="16" height="24" rx="8" fill="var(--card)"/>
<rect class="brand" x="84" y="166" width="16" height="44" rx="8" fill="var(--card)"/>
<rect class="brand" x="106" y="178" width="16" height="32" rx="8" fill="var(--card)"/>
<path class="cut" d="M 216 60 A 48 48 0 0 0 312 60" stroke-width="12" stroke-linecap="round"/>
<path class="echo" d="M 452 84 A 48 48 0 0 0 500 36" stroke-width="12" stroke-linecap="round"/>
</svg>
</div>
<div class="words">
<h1 class="name">LoopBack</h1>
<p class="tag">听进去，说出来，循环往复。</p>
</div>
</div>
</body>
</html>
