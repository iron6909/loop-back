<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>LoopBack app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA0FF"/>
      <stop offset="0.55" stop-color="#1976D2"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- loop ring: 300° counterclockwise, 60° gap at top-right -->
  <path d="M 281.7 110.3 A 148 148 0 1 0 395.1 205.4" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round" fill="none"/>
  <!-- arrowhead pointing back into the gap -->
  <path d="M 419.5 196.5 L 370.7 214.3 L 367.7 130.2 Z" fill="#FFFFFF"/>
  <!-- sound wave: listening and speaking inside the loop -->
  <rect x="176" y="214" width="44" height="84" rx="22" fill="#FFFFFF"/>
  <rect x="234" y="184" width="44" height="144" rx="22" fill="#FFFFFF"/>
  <rect x="292" y="204" width="44" height="104" rx="22" fill="#FFFFFF"/>
</svg>
